{% extends "base.html" %}
{% block title %}Удаление клиента{% endblock %}
{% block content %}
<h1>Удалить клиента «{{ customer.name }}»?</h1>
<p>Вы уверены, что хотите удалить этого клиента? Это действие нельзя отменить.</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Удалить</button>
    <a href="{% url 'customer_list' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
