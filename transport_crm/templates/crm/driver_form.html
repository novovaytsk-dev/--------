{% extends "base.html" %}
{% block title %}{% if form.instance.pk %}Редактирование{% else %}Добавление{% endif %} водителя{% endblock %}
{% block content %}
<h1>{% if form.instance.pk %}Редактирование{% else %}Добавление{% endif %} водителя</h1>
<form method="post" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Сохранить</button>
    <a href="{% url 'driver_list' %}" class="btn btn-outline-secondary">Отмена</a>
</form>
{% endblock %}
