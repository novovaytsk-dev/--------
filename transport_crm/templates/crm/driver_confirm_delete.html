{% extends "base.html" %}
{% block title %}Удаление водителя{% endblock %}
{% block content %}
<h1>Удалить водителя «{{ driver.first_name }} {{ driver.last_name }}»?</h1>
<p>Вы уверены, что хотите удалить этого водителя? Это действие нельзя отменить.</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Удалить</button>
    <a href="{% url 'driver_list' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
