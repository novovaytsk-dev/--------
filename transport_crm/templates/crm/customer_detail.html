{% extends "base.html" %}
{% block title %}{{ customer.name }}{% endblock %}
{% block content %}
<h1>{{ customer.name }}</h1>
<div class="card">
    <div class="card-body">
        <p><strong>Телефон:</strong> {{ customer.phone }}</p>
        <p><strong>Email:</strong> {{ customer.email|default:"—" }}</p>
        <p><strong>Адрес:</strong> {{ customer.address|default:"—" }}</p>
    </div>
</div>
<a href="{% url 'customer_list' %}" class="btn btn-secondary mt-3">Назад к списку</a>
{% endblock %}
